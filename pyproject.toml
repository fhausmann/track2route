[tool.poetry]
name = "track2route"
version = "0.1.2"
description = "Tool to convert GPX Track to a routeable GPXRoute."
authors = ["Fabian Hausmann"]

[tool.poetry.dependencies]
python = "^3.13"
geopy = "^2.4.1"
gpxpy = "^1.6.2"
sortedcontainers = "^2.3.0"
sphinx = {version = "^9.2.0", optional = true}
sphinx_rtd_theme = {version = "^3.1.0", optional = true}

[tool.poetry.extras]
docs = ["sphinx", "sphinx_rtd_theme", "rstcheck"]

[tool.poetry.scripts]
track2route = 'track2route.__main__:main'

[tool.poetry.group.dev.dependencies]
mypy = "^1.19.0"
ruff = "^0.14.8"
rope = "^1.14.0"
rstcheck = "^6.2.5"
importlib-metadata = "^8.7.0"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=track2route --cov-report=term --cov-branch"
testpaths = [
    "tests"
]
